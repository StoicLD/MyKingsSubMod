   trait_SanGong_YanShengGong: "衍圣公"
  trait_SanGong_YanShengGong_desc: "此人是孔氏后裔，被皇帝册封为衍圣公，主持朝廷文教祭祀，德高望重。"

trait_historical_TaiJian: "历史太监"
 historical_taijian_choushiliang_desc:0 "仇士良，晚唐权阉。历仕六朝，杀二王、一妃、四宰相。甘露之变后大杀朝臣，天子沦为傀儡四十载。"
 historical_taijian_tianlingzi_desc:0 "田令孜，晚唐权阉。僖宗呼为"阿父"，斗鸡走狗导帝游乐。黄巢乱起，挟帝奔蜀，朝政败坏之祸首。"
 historical_taijian_yangfuguang_desc:0 "杨复光，宦官名将。平黄巢之乱主力，招降朱温，善抚将士。宦官中少有的军事奇才，唐之存亡赖其一柱。"
 historical_taijian_liujishu_desc:0 "刘季述，晚唐权阉。废昭宗、立太子，专权跋扈。后为他人所诛，其变加速了唐室崩溃。"
 historical_taijian_hanquanhui_desc:0 "韩全诲，晚唐权阉。挟昭宗投凤翔李茂贞，与朱温对抗。城破被诛，自此唐室再无翻盘之力。"

 # 五代
 historical_taijian_zhangchengye_desc:0 "张承业，五代后唐忠宦。李克用托孤重臣，倾力辅佐李存勖建国，掌管军需粮秣十余年，忠义之名冠绝一时。"
 historical_taijian_zhangjuhan_desc:0 "张居翰，五代后唐宦官。改诏书"一行"为"一家人"，使千余人免死。一念之仁，救了上千条性命。"
 historical_taijian_gongchengshu_desc:0 "龚澄枢，南汉权宦。专断朝政，深宫享乐。宋兵至城下时束手无策，被俘斩首。"
 historical_taijian_lituo_desc:0 "李托，南汉宦官。掌兵权与朝政，与龚澄枢同掌大权。南汉灭国时被俘处斩。"

 # 北宋
 historical_taijian_tongguan_desc:0 "童贯，北宋权宦，封广阳郡王。平方腊、伐辽国，掌兵权二十载。宦官封王、封公爵，自古未有。然刚愎自用、功过参半。"
 historical_taijian_zhangmaoze_desc:0 "张茂则，北宋仁宗朝宦官。谨慎持重，与曹皇后有旧。为人低调，得以善终。"
 historical_taijian_leiyungong_desc:0 "雷允恭，北宋真宗朝权宦。掌山陵事而违制擅权，事发被诛。"
 historical_taijian_wangjien_desc:0 "王继恩，北宋太宗朝宦官。平定李顺起义，掌禁军兵权。谋立太子事败，贬死。"

 # 南宋
 historical_taijian_dongsongchen_desc:0 "董宋臣，南宋理宗朝宠宦。与阎贵妃勾结，陷害忠良。贾似道入相后方被逐出朝堂。"
 historical_taijian_luyunsheng_desc:0 "卢允升，南宋理宗朝宦官。与董宋臣结党营私，并称一时。贪财好利，蠹政害民。"

 # 元朝
 historical_taijian_pubuhua_desc:0 "朴不花，高丽籍宦官，元末权宦。与奇皇后勾结，内外擅权。元末大乱时仍争权不止，加速了元朝灭亡。"
 historical_taijian_libangning_desc:0 "李邦宁，元世祖朝宦官。历经三朝，老成持重。元世祖甚为器重，赐宅第，许乘舆入内。"

 # 明朝
 historical_taijian_zhenghe_desc:0 "郑和，明代大航海家。十岁入宫，七下西洋，足迹遍三十余国。率宝船数百、将士二万，远航万里，扬威异域。"
 historical_taijian_wangzhen_desc:0 "王振，明初权阉。原为儒生，自阉入宫。怂恿英宗亲征瓦剌，酿成土木堡之变——皇帝被俘、精锐尽丧。"
 historical_taijian_wangzhi_desc:0 "汪直，明朝西厂提督。掌西厂、屡兴大狱，权势熏天。以讨好万贵妃起家，后失宠被贬。"
 historical_taijian_fengbao_desc:0 "冯保，明朝司礼监掌印太监。与张居正内外配合，推行万历新政。通音律、善书法，有才干的权阉。"
 historical_taijian_liujin_desc:0 "刘瑾，明武宗朝权阉，"八虎"之首。权倾朝野，人称"立地皇帝"。置内行厂，诛戮无数。后凌迟处死，冤者拍手称快。"
 historical_taijian_weizhongxian_desc:0 "魏忠贤，明末最大权阉。原为赌徒，自阉入宫。结党营私、生祠遍天下，号"九千九百岁"。崇祯即位后自缢。"
 historical_taijian_wangchengen_desc:0 "王承恩，明末忠宦。崇祯朝司礼监太监，李自成破京城时随崇祯帝自缢于煤山。以死殉国，忠烈可嘉。"

 # 清朝
 historical_taijian_wuliangfu_desc:0 "吴良辅，清初宦官。顺治帝宠信，交接官员、贪赃不法。顺治死后被斩。"
 historical_taijian_andehai_desc:0 "安德海，清慈禧宠宦。骄横跋扈，出京采办龙袍，在山东被巡抚丁宝桢擒斩，慈禧亦不能救。"
 historical_taijian_lilianying_desc:0 "李莲英，晚清大总管。八岁自阉，侍奉慈禧四十余年。圆滑世故、善于逢迎，打破太监不过四品的祖制，官至二品。"
 historical_taijian_cuiyugui_desc:0 "崔玉贵，清慈禧身边得力太监。性格刚毅、办事得力。曾奉命将珍妃推入井中。"
 historical_taijian_xiaodezhang_desc:0 "小德张（张兰德），清末最后一位大太监。隆裕太后宠宦，精明能干。清亡后隐居天津，富甲一方，活到八十余岁。"

 # 武侠虚构
 historical_taijian_caozhengchun_desc:0 "曹正淳，东厂督主。一身天罡童子功深不可测，统领东厂数十年。虽为权阉，却心怀与铁胆神侯堂堂正正一战的武人执念。"
 historical_taijian_yuhuatian_desc:0 "雨化田，西厂督主。美貌阴狠，手段毒辣。执掌西厂时期，朝野闻其名而色变，连东厂亦退避三舍。"
 historical_taijian_liuxi_desc:0 "刘喜，东厂督主。习吸星大法，贪得无厌、野心极大。为夺绝世武功不择手段，是江湖中人人畏惧的大魔头。"
 historical_taijian_haidafu_desc:0 "海大富，清宫老太监。表面唯唯诺诺、病怏怏，实则深藏不露、精通毒术。奉旨追查《四十二章经》之秘，心狠手辣。"
  trait_track_drunkard_level: "嗜酒程度"
    trait_track_drunkard_level_desc: "嗜酒程度"
