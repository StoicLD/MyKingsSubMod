# 后宫宫位（公主体系 1~6）
  trait_SanGong_GongWei_1: "中宫皇后"
  SanGong_GongWei_1_desc: "中宫皇后，位居坤宁宫，母仪天下，统摄六宫，礼绝群妃。"
  SanGong_GongWei_1: "皇后"
  trait_SanGong_GongWei_2: "[Character.Custom('GongWei_FengHao')]皇贵妃"
  SanGong_GongWei_2_desc: "皇贵妃，位同副后，仅次于皇后，可协理六宫，恩宠仪制冠绝后宫。"
  SanGong_GongWei_2: "皇贵妃"
  trait_SanGong_GongWei_3: "[Character.Custom('GongWei_FengHao')]贵妃"
  SanGong_GongWei_3_desc: "贵妃，位居皇贵妃之下，为后宫高阶主位，分主东西十二宫。"
  SanGong_GongWei_3: "贵妃"
  trait_SanGong_GongWei_4: "[Character.Custom('GongWei_FengHao')]妃"
  SanGong_GongWei_4_desc: "妃，位在贵妃之下，居一宫正殿，为东西六宫之主，位份尊崇。"
  SanGong_GongWei_4: "妃"
  trait_SanGong_GongWei_5: "[Character.Custom('GongWei_FengHao')]嫔"
  SanGong_GongWei_5_desc: "嫔，位次于妃，为中阶主位，可居配殿，协理本宫事务。"
  SanGong_GongWei_5: "嫔"
  trait_SanGong_GongWei_6: "昭仪"
  SanGong_GongWei_6_desc: "昭仪，位在嫔下，随居配殿，无专宫之权，属低阶主位。"
  SanGong_GongWei_6: "昭仪"
  trait_SanGong_GongWei_7: "美人"
  SanGong_GongWei_7_desc: "美人，位居昭仪之下，随居偏殿，侍奉帝王起居，位份较低。"
  SanGong_GongWei_7: "美人"
  trait_SanGong_GongWei_8: "选侍"
  SanGong_GongWei_8_desc: "选侍，多由宫女晋封，位列末等，专司侍奉帝王起居。"
  SanGong_GongWei_8: "选侍"
  trait_SanGong_GongWei_9: "淑女"
  SanGong_GongWei_9_desc: "淑女，经选秀入宫，尚未正式受封，静候圣旨晋位。"
  SanGong_GongWei_9: "淑女"
  trait_SanGong_GongWei_10: "太妃"
  SanGong_GongWei_10_desc: "太妃"
  SanGong_GongWei_10: "太妃"
