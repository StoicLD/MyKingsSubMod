  SanGong_GongDian.007.a: "赐居#color_goldy_yellow #bold 【永寿宫_东配殿】#!      #color_dark_gray 西六宫永寿宫配殿 #!"
  SanGong_GongDian.007.b: "赐居#color_goldy_yellow #bold 【永寿宫_西配殿】#!      #color_dark_gray 西六宫永寿宫配殿 #!"
  SanGong_GongDian.007.c: "赐居#color_goldy_yellow #bold 【翊坤宫_延洪殿】#!      #color_dark_gray 西六宫翊坤宫配殿 #!"
  SanGong_GongDian.007.d: "赐居#color_goldy_yellow #bold 【翊坤宫_元和殿】#!      #color_dark_gray 西六宫翊坤宫配殿 #!"
  SanGong_GongDian.007.e: "赐居#color_goldy_yellow #bold 【储秀宫_养和殿】#!      #color_dark_gray 西六宫储秀宫配殿 #!"
  SanGong_GongDian.007.f: "赐居#color_goldy_yellow #bold 【储秀宫_绥福殿】#!      #color_dark_gray 西六宫储秀宫配殿 #!"
  SanGong_GongDian.007.g: "赐居#color_goldy_yellow #bold 【咸福宫_东配殿】#!      #color_dark_gray 西六宫咸福宫配殿 #!"
  SanGong_GongDian.007.h: "赐居#color_goldy_yellow #bold 【咸福宫_西配殿】#!      #color_dark_gray 西六宫咸福宫配殿 #!"
  SanGong_GongDian.007.i: "赐居#color_goldy_yellow #bold 【长春宫_绥寿殿】#!      #color_dark_gray 西六宫长春宫配殿 #!"
  SanGong_GongDian.007.j: "赐居#color_goldy_yellow #bold 【长春宫_承禧殿】#!      #color_dark_gray 西六宫长春宫配殿 #!"
  SanGong_GongDian.007.k: "赐居#color_goldy_yellow #bold 【启祥宫_东配殿】#!      #color_dark_gray 西六宫启祥宫配殿 #!"
  SanGong_GongDian.007.l: "赐居#color_goldy_yellow #bold 【启祥宫_西配殿】#!      #color_dark_gray 西六宫启祥宫配殿 #!"
  SanGong_GongDian.007.tooltip_c: "#color_dark_gray 明万历建翊坤宫延洪殿，初为妃嫔接见亲眷之所；清乾隆重修，令懿皇贵妃（孝仪纯皇后）居翊坤宫时，于此处理宫务、接见宫眷。#!"
  SanGong_GongDian.007.tooltip_d: "#color_dark_gray 明代翊坤宫元和殿为存放珍宝、首饰之所；清同治朝懿贵妃（慈禧）居翊坤宫时，于此存放私房器物、召见心腹太监。#!"
  SanGong_GongDian.007.tooltip_e: "#color_dark_gray 明崇祯建储秀宫养和殿，为妃嫔静养、安胎之所；清咸丰朝兰昭仪（慈禧）居储秀宫时，于此诞下同治帝，后改为纪念性辅殿。#!"
  SanGong_GongDian.007.tooltip_f: "#color_dark_gray 明代储秀宫绥福殿为女红、制衣之所；清光绪朝珍妃居储秀宫时，于此研习西学、存放西洋钟表等物。#!"
  SanGong_GongDian.007.tooltip_g: "#color_dark_gray 明嘉靖建咸福宫东配殿，为低位妃嫔居住之所；清道光朝彤贵妃居咸福宫时，于此教导宫中宫女读书、识字。#!"
  SanGong_GongDian.007.tooltip_h: "#color_dark_gray 明代咸福宫西配殿为膳房、茶房之所；清光绪朝瑾妃居咸福宫时，于此督造宫廷茶点，喜研茶道，常邀姐妹品茶小聚。#!"
  SanGong_GongDian.007.tooltip_i: "#color_dark_gray 明永乐建长春宫绥寿殿，为妃嫔礼佛、抄经之所；清乾隆朝孝贤纯皇后居长春宫时，于此抄写佛经、祈福延寿。#!"
  SanGong_GongDian.007.tooltip_j: "#color_dark_gray 明代长春宫承禧殿为接待赏赐、领受恩旨之所；清同治朝慈安太后居长春宫时，于此接受妃嫔请安、颁下懿旨。#!"
  SanGong_GongDian.007.tooltip_k: "#color_dark_gray 明永乐建启祥宫，初名未央宫，东配殿为宫人值宿之所；清康熙重修，此殿为无宠嫔御临时居住、避世静养之地。#!"
  SanGong_JiaLi.014.tooltip_l: "#color_dark_gray 明代启祥宫西配殿为存放典籍、书画之所；清乾隆朝将其改为太监值房，因启祥宫位置偏僻，少有人至，常年清静。#!"

  SanGong_GongDian.020_desc: "朕惟宫闱之制，所以辨等威、正名分也。[recipient.Custom('GongWei_name')][recipient.GetDynastyHouseNameNoTooltip]氏淑慎端良，久侍禁闱，今当钦定寝宫，俾得安居，以顺六宫之序，以固内廷之宁。其择吉所安置，毋违礼制。"
  SanGong_GongDian.020_title: "移居新宫"
  SanGong_GongDian.020_title_3: " 奉旨腾宫"
  SanGong_GongDian.020_desc_2: "#v 朕惟六宫居所，轮替有章，原宫另属，宜徙新址。[recipient.Custom('GongWei_name')][recipient.GetDynastyHouseNameNoTooltip]氏既出旧宫，当另择寝宫安插，钦命迁居别所，顺承内廷之序，恪遵礼制毋违。#!"
  SanGong_GongDian.020.a: "迁入正宫   #color_dark_gray （东六宫） #!"
  SanGong_GongDian.020.b: "迁入正宫   #color_dark_gray （西六宫） #!"
  SanGong_GongDian.020.c: "   驻跸配殿   #color_dark_gray （东六宫配殿） #!"
  SanGong_GongDian.020.d: "   驻跸配殿   #color_dark_gray （西六宫配殿） #!"
  SanGong_GongDian_020_t1: "#color_dark_gray 主宫正殿为妃位以上高位嫔妃所居，殿宇崇宏、礼制森严，依位份配属宫人、器物、俸禄，以别尊卑、明等级，乃后宫位望尊崇之象征。#!"
  SanGong_GongDian_020_t2: "#color_dark_gray 东六宫为后宫常制居所，侧殿多安置位阶稍次者，规制略降于主宫，院落规整、居处清雅，一应供给皆循内廷旧例，合于六宫次序。#!"
  SanGong_GongDian_020_t3: "#color_dark_gray 西六宫同属内廷常制，侧殿规制与东六宫相仿，位份、用度、侍从皆依典章定例，静谧宜居，用以安处嫔妃、整肃宫闱秩序。#!"
  SanGong_GongDian.021_desc: "朕惟宫闱之制，秩崇则居崇，升降自有常典。[recipient.Custom('GongWei_name')][recipient.GetDynastyHouseNameNoTooltip]氏晋膺新秩，淑慎有加，宜更定寝宫以崇其位，辨等威、正名分，顺六宫之序，安内廷之规。其择吉徙居，恪遵礼制。"
  SanGong_GongDian.021_title: "晋秩迁居"
  SanGong_GongDian.021.a: "迁入主宫   # color_dark_gray 东六宫 #!"
  SanGong_GongDian.021.b: "迁入主宫   #color_dark_gray 西六宫 #!"
  SanGong_GongDian.021.c: "安置于配殿   #color_dark_gray 东六宫配殿 #!"
  SanGong_GongDian.021.d: "安置于配殿   #color_dark_gray 西六宫配殿 #!"
  SanGong_GongDian.022_desc: "朕惟宫闱名分，位降则居徙，法度昭然。[recipient.Custom('GongWei_name')][recipient.GetDynastyHouseNameNoTooltip]氏既降旧秩，宜更居所以守规制、自省愆尤。今徙居次等宫室，顺六宫之序，安内廷之宁。其如期移徙，毋得违滞。"
  SanGong_GongDian.022_title: "降秩徙居"
  SanGong_GongDian.022.a: "徙居别宫"
  SanGong_GongDian.022.b: "徙居东六宫偏殿居所"
  SanGong_GongDian.022.c: "徙居西六宫偏殿居所"
  SanGong_GongDian.023_desc: "朕惟宫闱规制，殿宇各有攸归，位次宜循典章。今因定省攸宜、分位更定，[recipient.Custom('GongWei_name')][recipient.GetDynastyHouseNameNoTooltip]氏着即迁出原居，另择宫室安插，以肃禁闱之序、正宫掖之规。其即刻移徙，毋得迟滞。"
  SanGong_GongDian.023_title: "腾宫迁出"
  SanGong_GongDian.023.a: "徙居别宫主殿"
  SanGong_GongDian.023.b: "徙居东六宫偏殿居所"
  SanGong_GongDian.023.c: "徙居西六宫偏殿居所"
  GongDian_youzhu_dong_jingren: "#v 【景仁宫】已经有主#!#color_white \n[LiuGong_dong_jingren.Custom('GongWei_FengHao')][LiuGong_dong_jingren.Custom('GongWei_name')]  [LiuGong_dong_jingren.GetDynastyHouseNameNoTooltip]氏（[LiuGong_dong_jingren.GetDynasty.GetBaseNameNoTooltip][LiuGong_dong_jingren.GetUIFirstNameOnlyNotMeNoTooltip]）#!#v  将会腾宫迁居#!"
  GongDian_youzhu_dong_jingren_1: "#v 【景仁宫_东配殿】已经有主#!#color_white \n[LiuGong_dong_jingren_1.Custom('GongWei_FengHao')][LiuGong_dong_jingren_1.Custom('GongWei_name')]  [LiuGong_dong_jingren_1.GetDynastyHouseNameNoTooltip]氏（[LiuGong_dong_jingren_1.GetDynasty.GetBaseNameNoTooltip][LiuGong_dong_jingren_1.GetUIFirstNameOnlyNotMeNoTooltip]）#!#v  将会腾宫迁居#!"
