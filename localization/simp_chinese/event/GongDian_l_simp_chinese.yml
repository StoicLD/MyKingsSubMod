  SanGong_GongDian.006.l: "赐居#color_goldy_yellow #bold 【景阳宫_西配殿】#!      #color_dark_gray 东六宫景阳宫配殿 #!"
  SanGong_GongDian.006.tooltip_a: "#color_dark_gray Tips:明永乐十八年建，初名长安宫，嘉靖年间更名景仁宫，东配殿为宫人侍值、起居辅殿；清顺治重修，孝康章皇后居此时，此殿为贴身宫人值宿之所，亦供宫眷休憩。#!"
  SanGong_GongDian.006.tooltip_b: "#color_dark_gray Tips:明代为景仁宫辅殿，专供妃嫔女红、休憩之用；清乾隆朝令贵妃居此宫时，常于西配殿教导宫人教养，为宫眷习礼、针线之所。#!"
  SanGong_GongDian.006.tooltip_c: "#color_dark_gray Tips:明永乐始建，初名永宁宫，崇祯年间更名承乾宫，东配殿为高位妃嫔礼佛、抄经之所；清顺治重修，孝献皇后董鄂氏居此时，于此静心礼佛、抄写经文。#!"
  SanGong_GongDian.006.tooltip_d: "#color_dark_gray Tips:明代为承乾宫配殿，专司存放妃嫔服饰、器物，配套主殿起居；清道光朝孝全成皇后曾于此临时御见臣妇，亦为宫装、首饰储物辅殿。#!"
  SanGong_GongDian.006.tooltip_e: "#color_dark_gray Tips:明永乐建，初名咸阳宫，嘉靖更名钟粹宫，曾作太子东宫辅殿、宫人值房；清咸丰朝慈安太后居此时，东配殿为宫人侍疾轮值之所，供皇后起居配套。#!"
  SanGong_GongDian.006.tooltip_f: "#color_dark_gray Tips:明代为太子读书、典藏典籍之处，后改为妃嫔辅殿；清同治朝慈安太后常于此阅览经卷、教导同治帝读书，殿内珍藏宫廷典籍书画。#!"
  SanGong_GongDian.006.tooltip_g: "#color_dark_gray Tips:明永乐十八年建，初名永安宫，嘉靖更名永和宫，东配殿为妃嫔文墨、书房之所；清光绪朝瑾妃居此时，于此研墨作画，存放笔墨纸砚等文房器具。#!"
  SanGong_GongDian.006.tooltip_h: "#color_dark_gray Tips:明代为永和宫配殿，供膳食备办、宫人杂役值守；清光绪朝瑾妃喜研饮食，于此督造宫廷点心，为宫内小膳房、饮食备办之所。#!"
  SanGong_GongDian.006.tooltip_i: "#color_dark_gray Tips:明永乐建，初名长寿宫，嘉靖改延祺宫，清定名延禧宫，东配殿为低位妃嫔、宫人居住；清道光朝恬嫔于此养病，屡经火患重修，为延禧宫保存较完整的配殿。#!"
  SanGong_GongDian.006.tooltip_j: "#color_dark_gray Tips:明代为延禧宫杂役值房、储物之所，因宫位偏僻少用；清光绪朝珍妃居此时，将西配殿改为存放西洋器物、奇巧小物的储物室，一改旧用。#!"
  SanGong_GongDian.006.tooltip_k: "#color_dark_gray Tips:明永乐建，初名长阳宫，嘉靖更名景阳宫，为妃嫔静居、侍从办公辅殿；清康熙重修后，改为宫廷刻本、古籍藏书室，极少安排宫眷居住。#!"
  SanGong_GongDian.006.tooltip_l: "#color_dark_gray Tips:明代为景阳宫宫人、太监值房，因宫址偏僻，多为无宠宫人暂住；清沿为守宫太监值房，环境清静，常作为无宠嫔御临时居住之所。#!"
  SanGong_GongDian.007_title: "赐居配殿"
