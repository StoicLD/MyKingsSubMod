  SanGong_DianZhang.061_t:0 "皇子回京"
  SanGong_DianZhang.061_d:0 "朕承继大统，登临九五，诸皇子或分封在外，或羁縻他方，散落四方久矣。今四海初定，宗庙为重，宜召诸子还京，以固国本、安人心。"
  SanGong_DianZhang.061.a:0 "召所有皇子即刻回京"
  SanGong_DianZhang.061.b:0 "指定皇子回京"
  SanGong_DianZhang.061.c:0 "尽召诸皇子回京"
  SanGong_DianZhang.061.d:0 "暂缓其事"

SanGong_DianZhang.062.a: "臣诚惶诚恐，顿首奉诏"


#特进殊号
  SanGong_DianZhang.025_title: "特进殊号"
  SanGong_DianZhang.025_desc: "今有肱骨之臣[QuanChen.GetName]，功高盖世，威震四方。当择殊号以封之，彰其功勋。"
  SanGong_DianZhang.025.a: "古官号不足以称，乃加号天策上将#Y 【天策上将】#!"
  SanGong_DianZhang.025.b: "冲天香阵透长安，满城尽带黄金甲#Y 【冲天太保均平大将军】#!"
  SanGong_DianZhang.025.c: "将军岂有号宇宙者乎？#Y 【宇宙大将军】#!"
  SanGong_DianZhang.025.d: "挟天子以令诸侯，总百官以定朝纲#Y 【大丞相】#!"
  SanGong_DianZhang.025.e: "功高孟德，势倾朝野，加号天柱大将军#Y 【天柱大将军】#!"

  SanGong_ZhongJie.001.t:0 "社稷倾覆"
  SanGong_ZhongJie.001.desc:0 "是日，贼师入关，禁城不守。朕御丹凤门楼，临轩四望，但见烟焰张天，戈鋋蔽野。\n\n禁军或溃或没，竟无一人至御前。宫人星散，内侍委符而去者十八九。朕解佩剑，置诸案上，徐步出殿。\n\n回望宫阙巍然如故，而山河不复为吾有矣。忽忆先帝不豫之日，执朕手而嘱曰：「社稷付汝，善守之。」言犹在耳，而社稷亡矣。\n\n自笺曰：兴亡有数，非一人可回。"
  SanGong_ZhongJie.001.a:0 "天命已讫，非战之罪"

  SanGong_ZhongJie.001_tt: "#R 京城大乱，宗室、后宫诸人，或死于乱军，或远走他乡#! #weak 所有在京宗室、后宫嫔妃概率触发王朝覆灭死亡事件#!"
  SanGong_ZhongJie.002.t: "鼎革易代"
  SanGong_ZhongJie.002.desc: "天命更迭，国祚移转，神器易主，新朝已立。\n[NewHuangDi.GetName]顺应时势，取而代之，登临大位，执掌天下。\n新朝既立，大局初定，经过连日搜捕与清剿，朝廷已擒获大批潜藏的前朝宗族亲党。\n前朝末帝[MoDaiHuangDi.GetDynasty.GetBaseNameNoTooltip][MoDaiHuangDi.GetUIFirstNameOnlyNotMeNoTooltip]已然失国，却仍是旧族之心所向。\n旧君犹在，宗族就擒，人心未定，此乃新朝立国之初最大隐患。"
  #SanGong_ZhongJie.002.a: "遵二王三恪，奉其宗庙"
  SanGong_ZhongJie.002.a: "今天，最高兴了！！！！！！"
  SanGong_ZhongJie.002.b: "夷其三族！！！！！！"
  SanGong_ZhongJie.002.c: "夷灭宗族，斩草除根"
  SanGong_ZhongJie.002.b_t1: "擒获部分前朝宗室"
  SanGong_ZhongJie.002.b_t2: "前去处理前朝余孽"
  #SanGong_ZhongJie.002.b_t2: "释放全部前朝宗室"
  SanGong_ZhongJie.002.b_t3: "旧帝及近亲被处决"
  SanGong_ZhongJie.002.b_t4: "旧帝及全族宗室被处决"
  SanGong_ZhongJie.003.t: "神器更易"
  SanGong_ZhongJie.003.desc: "天命更迭，国祚移转，神器易主，新朝已立。\n[MoDaiHuangDi.GetDynasty.GetBaseNameNoTooltip]氏德衰，天命已去；[NewHuangDi.GetDynasty.GetBaseNameNoTooltip]氏[NewHuangDi.GetLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]朝应运而兴，当承天命、临御天下。"
  SanGong_ZhongJie.003.a: "怎么皇家的事情总是这么糟糕？"
  SanGong_ZhongJie.005.t: "擒首定乱"
  SanGong_ZhongJie.005.desc: "#v #BOLD 朕整肃六军，兴师出征，讨伐伪主[MoDaiHuangDi.GetFirstName]。\n大军所至势如破竹，一举覆其国。\n[MoDaiHuangDi.GetFirstName]连战皆败，穷途末路之下束手被擒。自此连年兵戈、两国对峙的纷乱局面，终告平息。"
  SanGong_ZhongJie.005.a: "前去处理"
  SanGong_ZhongJie.005.b: "夷其三族"

#推举
  SanGong_ZongFaJiCheng.001.t: "朝臣推戴！"
  SanGong_ZongFaJiCheng.001.d1: "朝会之上\n[target1.GetName]躬身出班，朗声奏道：\n陛下，国本不可不定，储君不可不立。\n臣观皇子[target2.GetName]仁厚端方，德行昭著，待人谦和而有威仪，处事公允而得人心，上可承宗庙之重，下可抚朝野之望，外交于内而安定四方。\n实在是东宫太子的上上之选，臣冒死恳请陛下早定大计，立为储君！"
  SanGong_ZongFaJiCheng.001.d2: "朝会之上\n[target1.GetName]躬身出班，朗声奏道：\n陛下，江山社稷，系于兵戎，储君之才，必在武略。\n臣观皇子[target2.GetName]勇武刚毅，熟知军旅，练兵有法，治军严明，临事果决而不慌乱，临危镇定而有胆魄，可安边疆、御外侮、镇内乱，延续国祚。\n此等雄才，正合储君之位，臣恳请陛下立为太子！"
  SanGong_ZongFaJiCheng.001.d3: "朝会之上\n[target1.GetName]躬身出班，朗声奏道：\n陛下，民生为天，财赋为国之根基。\n臣观皇子[target2.GetName]心性务实，体恤百姓，重农桑、劝耕织、理财有道，能使国库充盈，万民安乐，不尚虚华而重实效，心怀天下而体民情。\n将来继位必能养民富国，实为储君之良选，臣恳请陛下立为太子！"
  SanGong_ZongFaJiCheng.001.d4: "朝会之上\n[target1.GetName]躬身出班，朗声奏道：\n陛下，朝堂之内，暗流隐忧，不可不察。\n臣观皇子[target2.GetName]心思缜密，智虑深远，明是非、辨忠奸、知进退，能察未萌之患，能断隐秘之事，肃清朝纲而安定内外。\n有稳局之才，有护主之能，堪当东宫之位，臣恳请陛下立为太子！"
  SanGong_ZongFaJiCheng.001.d5: "朝会之上\n[target1.GetName]躬身出班，朗声奏道：\n陛下，教化兴则国运昌，礼义定则天下安。\n臣观皇子[target2.GetName]崇儒重道，好学不倦，通古今之变，明圣贤之义，文足以服士子，德足以化万民，承宗庙而兴文治，秉礼义而治天下。\n德行才学皆合储君之尊，臣恳请陛下立为太子！"
  SanGong_ZongFaJiCheng.001.a: "知道了"
  SanGong_ZongFaJiCheng.001.b: "知道了"
  SanGong_ZongFaJiCheng.001.c: "知道了"
  SanGong_ZongFaJiCheng.001.d: "知道了"
  SanGong_ZongFaJiCheng.001.e: "知道了"

  SanGong_ZongFaJiCheng.001_tt1: "[target2.GetName]获得了[target1.GetName]的支持，候选分数上升"
  SanGong_ZongFaJiCheng.001_tt2: "[target2.GetName]获得了[target1.GetName]的支持，候选分数上升"
  SanGong_ZongFaJiCheng.001_tt3: "[target2.GetName]获得了[target1.GetName]的支持，候选分数上升"
  SanGong_ZongFaJiCheng.001_tt4: "[target2.GetName]获得了[target1.GetName]的支持，候选分数上升"
  SanGong_ZongFaJiCheng.001_tt5: "[target2.GetName]获得了[target1.GetName]的支持，候选分数上升"



#过继
  SanGong_Zongzu.001.t: "大宗绝嗣"
  SanGong_Zongzu.001.d: "#v #BOLD 朕临御寰宇，底定邦家，膝下乏嗣，宗庙无承。国本悬空，宗祧难继，事关社稷兴衰。\N兹择宗室宗枝之中品行端良、才德兼备者入继大宗，立为皇嗣，续祖宗血食，安朝野人心，永固国祚根基。"
  SanGong_Zongzu.001.a: "择宗入继，立为嗣子"
  SanGong_Zongzu.002.t: "册立太孙"
  SanGong_Zongzu.002.d: "#v [Taizi.GetNicknameNoTooltip][Taizi.GetName]#!#V 薨逝，储位虚悬。然太子素有仁德，深孚众望，其嫡嗣亦天资聪颖，颇有乃父之风。"
  SanGong_Zongzu.002.a: "立为太孙"
  SanGong_Zongzu.002.b: "不立太孙，另择储君"



SanGong_Zongzu.004.t: "皇子出继敕"
SanGong_Zongzu.004.desc: "门下：\n\n宗藩建屏，以固邦基，宗室承祧，以续世祚。\n\n[fanwang.GetName]受封藩维，镇抚一方，恪恭职守，历有年所。\n今年岁既暮，宗祧不继，藩绪将绝。\n若不立嗣接续，恐一脉湮没、封祚无传，愧对祖宗。\n\n朕君临四海，敦睦宗亲，不忍宗支绝祀。\n特命皇子[huangzi.GetName]出继[fanwang.GetName]为嗣，归入藩宗谱系，承其爵祀、继其世业。\n\n庶使藩绪永续、宗祀不绝，以昭朕亲亲笃厚之意。"
SanGong_Zongzu.004.a: "主者施行"





#宗藩继承
  SanGong_DianZhang.041.t: "袭爵"
  SanGong_DianZhang.041.desc: "[Dead_FanWang.GetName]薨于封国，讣闻上达，朝野致哀。其爵位承袭之事，宜速定夺。"
  SanGong_DianZhang.041.a: "准予：世袭罔替"
  SanGong_DianZhang.041.b: "准予：降等承袭"
  SanGong_DianZhang.041.c: "不准承爵，撤除藩国，收回爵禄封地，点检交割"
  SanGong_DianZhang.041.d: "无嗣除国，收回爵禄封地，点检交割"





  SanGong_DianZhang.046.t: "遵旨袭爵"
  SanGong_DianZhang.046.desc: "先王薨逝，天恩垂怜，陛下特下圣旨，命臣承袭王位，以镇藩地、安民心。"
  SanGong_DianZhang.046.a: "遵旨奏报，静候陛下安谕"



  SanGong_DianZhang.051_title: "藩国之变"
  SanGong_DianZhang.051_desc: "如今藩国大权尽在我手，昔日的宗藩体制早已名存实亡，难以维系国本、安抚民心。与其固守旧制，不如顺势而为"
  SanGong_DianZhang.051.a: "推行天朝制"
  SanGong_DianZhang.051.b: "推行贤能制"

  SanGong_ZongShi_Rank.400_title: "增补宗室爵位"
  SanGong_ZongShi_Rank.400_desc: "宗室成员[supplement_rank_target.GetName]尚无爵位，今择一等下级宗室爵位予以增补。"
  SanGong_ZongShi_Rank.400.a: "授镇国将军"
  SanGong_ZongShi_Rank.400.b: "授辅国将军"
  SanGong_ZongShi_Rank.400.c: "授奉国将军"
  SanGong_ZongShi_Rank.400.d: "授镇国中尉"
  SanGong_ZongShi_Rank.400.e: "授辅国中尉"
  SanGong_ZongShi_Rank.400.f: "授奉国中尉"
