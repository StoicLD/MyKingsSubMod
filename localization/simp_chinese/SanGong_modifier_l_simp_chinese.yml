# ── 宗族修正 ──
  SanGong_chronicle_farming_scholar_modifier: "耕读传家"
  SanGong_chronicle_farming_scholar_modifier_desc: "先帝身出黎庶，耕读传家，后世子孙皆以诗书为业，以田亩为本，家业绵延不绝。"
  SanGong_chronicle_military_lineage_modifier: "将门源远"
  SanGong_chronicle_military_lineage_modifier_desc: "先帝世承武勋，将门源远流长，子孙骨血中自有一腔戎马之志。"
  SanGong_chronicle_court_official_modifier: "簪缨世胄"
  SanGong_chronicle_court_official_modifier_desc: "先帝出身前朝仕宦，累代位列朝堂，子孙深谙庙堂进退之道。"
  SanGong_chronicle_wanderer_modifier: "江湖遗风"
  SanGong_chronicle_wanderer_modifier_desc: "先帝本是草泽游民，四海漂泊，子孙承其机敏通达，善于在夹缝中觅得生机。"
  SanGong_chronicle_noble_clan_modifier: "世家望族"
  SanGong_chronicle_noble_clan_modifier_desc: "先帝生于世家望族，门第显赫，子孙骨子里便带着一股与生俱来的贵气。"
  SanGong_chronicle_garrison_modifier: "边塞铁血"
  SanGong_chronicle_garrison_modifier_desc: "先帝出自边塞军户，世代戍守疆土，子孙悍勇果敢，不畏刀兵。"
  SanGong_chronicle_merchant_modifier: "陶朱遗风"
  SanGong_chronicle_merchant_modifier_desc: "先帝出身商贾之家，市井货殖，子孙精于算计，善积货财。"
  SanGong_chronicle_recluse_scholar_modifier: "山林儒风"
  SanGong_chronicle_recluse_scholar_modifier_desc: "先帝长于隐世儒门，潜心治学不涉仕途，子孙承其清正，学问通神。"
  SanGong_chronicle_artisan_modifier: "百工称绝"
  SanGong_chronicle_artisan_modifier_desc: "先帝乃方技匠人之后，百工精通，子孙传承匠心，工造之术冠绝天下。"
# ── 宗族修正 ──
SanGong_chronicle_uprising_people_modifier: "为除苛政"
SanGong_chronicle_uprising_people_modifier_desc: "先帝起兵为除苛政，安民济世，子孙承此仁心，深得民心。"
SanGong_chronicle_uprising_peace_modifier: "止息兵祸"
SanGong_chronicle_uprising_peace_modifier_desc: "先帝起兵平定割据，止息兵祸，子孙以战止战，武德充沛。"
SanGong_chronicle_uprising_order_modifier: "拨乱反正"
SanGong_chronicle_uprising_order_modifier_desc: "先帝起兵匡扶社稷，拨乱反正，子孙秉持大义，名正言顺。"
SanGong_chronicle_uprising_save_modifier: "拯救苍生"
SanGong_chronicle_uprising_save_modifier_desc: "先帝起兵赈济流民，拯救苍生，子孙广施仁政，万民归心。"
SanGong_chronicle_uprising_defend_modifier: "守护疆土"
SanGong_chronicle_uprising_defend_modifier_desc: "先帝起兵抵御外寇，守护疆土，子孙铁骨铮铮，寸土不让。"
SanGong_chronicle_uprising_fair_modifier: "均平世道"
SanGong_chronicle_uprising_fair_modifier_desc: "先帝起兵摧抑豪强，均平世道，子孙嫉恶如仇，公正严明。"
SanGong_chronicle_uprising_justice_modifier: "昭雪冤屈"
SanGong_chronicle_uprising_justice_modifier_desc: "先帝起兵肃正法度，昭雪冤屈，子孙明察秋毫，法理昭彰。"
SanGong_chronicle_uprising_rural_modifier: "安定乡野"
SanGong_chronicle_uprising_rural_modifier_desc: "先帝起兵肃清盗乱，安定乡野，子孙保境安民，四方绥靖。"
SanGong_chronicle_uprising_court_modifier: "安固朝堂"
SanGong_chronicle_uprising_court_modifier_desc: "先帝起兵清肃奸邪，安固朝堂，子孙深谙权谋，稳坐庙堂。"

SanGong_chronicle_founding_virtue_modifier: "以德服人"
SanGong_chronicle_founding_virtue_modifier_desc: "先帝以德服人，民心归往，子孙德泽深厚，天下景从。"
SanGong_chronicle_founding_force_modifier: "武力定疆"
SanGong_chronicle_founding_force_modifier_desc: "先帝百战平乱，武力定疆，子孙骁勇善战，拓土开疆。"
SanGong_chronicle_founding_strategy_modifier: "智定权谋"
SanGong_chronicle_founding_strategy_modifier_desc: "先帝智定权谋，尽收九州，子孙足智多谋，算无遗策。"
SanGong_chronicle_founding_talent_modifier: "广纳贤才"
SanGong_chronicle_founding_talent_modifier_desc: "先帝广纳贤才，共治天下，子孙礼贤下士，英才辈出。"
SanGong_chronicle_founding_stability_modifier: "固本培元"
SanGong_chronicle_founding_stability_modifier_desc: "先帝安抚万民，固本培元，子孙根基稳固，国祚绵长。"
SanGong_chronicle_founding_unify_modifier: "一统山河"
SanGong_chronicle_founding_unify_modifier_desc: "先帝剪除割据，一统山河，子孙志在四方，天下一家。"
SanGong_chronicle_founding_govern_modifier: "安定社稷"
SanGong_chronicle_founding_govern_modifier_desc: "先帝整肃吏治，安定社稷，子孙治国严明，朝纲有序。"
SanGong_chronicle_founding_border_modifier: "绥靖远夷"
SanGong_chronicle_founding_border_modifier_desc: "先帝怀柔四方，绥靖远夷，子孙恩威并施，四夷宾服。"
SanGong_chronicle_founding_culture_modifier: "肇基盛世"
SanGong_chronicle_founding_culture_modifier_desc: "先帝修明文教，肇基盛世，子孙文脉昌盛，礼乐兴邦。"

SanGong_chronicle_govern_rest_modifier: "与民休息"
SanGong_chronicle_govern_rest_modifier_desc: "先帝轻徭薄赋，与民休息，子孙爱惜民力，国库丰盈。"
SanGong_chronicle_govern_official_modifier: "澄清吏治"
SanGong_chronicle_govern_official_modifier_desc: "先帝严整官制，澄清吏治，子孙察吏安民，官场清明。"
SanGong_chronicle_govern_ritual_modifier: "礼乐安民"
SanGong_chronicle_govern_ritual_modifier_desc: "先帝崇文兴教，礼乐安民，子孙以礼治国，教化万方。"
SanGong_chronicle_govern_law_modifier: "严明刑律"
SanGong_chronicle_govern_law_modifier_desc: "先帝整肃法度，严明刑律，子孙执法如山，赏罚分明。"
SanGong_chronicle_govern_diplomacy_modifier: "怀柔远邦"
SanGong_chronicle_govern_diplomacy_modifier_desc: "先帝安抚边陲，怀柔远邦，子孙折冲樽俎，睦邻安邦。"
SanGong_chronicle_govern_treasure_modifier: "充盈国库"
SanGong_chronicle_govern_treasure_modifier_desc: "先帝劝课农桑，充盈国库，子孙善理财赋，富甲天下。"
SanGong_chronicle_govern_merit_modifier: "任人唯贤"
SanGong_chronicle_govern_merit_modifier_desc: "先帝慎选贤能，任人唯贤，子孙知人善任，俊杰在朝。"
SanGong_chronicle_govern_court_modifier: "确立朝纲"
SanGong_chronicle_govern_court_modifier_desc: "先帝规整礼制，确立朝纲，子孙威仪赫赫，朝堂肃然。"
SanGong_chronicle_govern_trade_modifier: "富足市井"
SanGong_chronicle_govern_trade_modifier_desc: "先帝通商利民，富足市井，子孙商路通达，百业兴旺。"
