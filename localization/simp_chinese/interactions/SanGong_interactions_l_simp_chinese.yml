## 五、储君、太后相关互动

  CeLi_taizi_interaction: "册立太子"
  recipient_secondary_CeLi_taizi_interaction: "#color_green #bold 东宫储君#"
  CeLi_taizi_interaction_tooltip: "#V 皇子[secondary_recipient.GetDynastyHouseNameNoTooltip][secondary_recipient.GetUIFirstNameOnlyNotMeNoTooltip]，温恭懋著，孝友天成，持身有道，器识夙成。朕仰遵祖制，俯顺舆情，特遣使持节，册立为皇太子，授以储位，重固国本，上承宗庙，下安兆民。#!"
