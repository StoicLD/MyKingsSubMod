  recipient_secondary_CeLi_taisun_interaction: "#color_green #bold 皇太子之继承人#"
  CeLi_taisun_interaction_tt1: "角色必须采用指定的立储法。"
  CeLi_taisun_interaction_tooltip: "#V 皇孙[secondary_recipient.GetDynastyHouseNameNoTooltip][secondary_recipient.GetUIFirstNameOnlyNotMeNoTooltip]，系出东宫，德才兼备。朕特遣使持节，册封为皇太孙，承皇太子之后，重固国本。#!"

  FeiChu_taizi_interaction: "废黜太子"
  FeiChu_taizi_interaction_tooltip: "#V 太子[recipient.GetDynastyHouseNameNoTooltip][recipient.GetUIFirstNameOnlyNotMeNoTooltip]，失德罔检，行止不端，不堪承继宗庙，难抚天下兆民。朕为社稷苍生计，不得已废黜其太子之位，以肃国本，安朝野之心。#!"
  FeiChu_taisun_interaction: "废黜皇太孙"
  FeiChu_taisun_interaction_tooltip: "#V 皇太孙[recipient.GetDynastyHouseNameNoTooltip][recipient.GetUIFirstNameOnlyNotMeNoTooltip]，今废其皇太孙之位，收回储位名分，以正国本。#!"

